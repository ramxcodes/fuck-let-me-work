# Push a tag like v0.1.0 to build every binary and publish a GitHub release.
# It runs on macOS because the macOS tray needs cgo; the other targets are pure Go.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./... && go test ./...

      - name: Build
        run: |
          mkdir dist
          flags='-trimpath -ldflags=-s -ldflags=-w'
          # macOS: one universal file (Apple Silicon + Intel) with the tray.
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch go build $flags -o dist/darwin-$arch ./cmd/flmw
          done
          lipo -create -output dist/flmw-darwin-universal dist/darwin-arm64 dist/darwin-amd64
          rm dist/darwin-arm64 dist/darwin-amd64
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build $flags -o dist/flmw-$os-$arch$ext ./cmd/flmw
          done
          cd dist && shasum -a 256 * > checksums.txt && cat checksums.txt

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
